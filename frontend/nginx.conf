server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los archivos de assets llevan un hash en el nombre: nunca cambian.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Las rutas de Vue Router (/tienda, /mi-panel...) las resuelve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
